name: Michael Okoye
nickname: or just Mico
mobileName: Mico
role: Product & interaction designer
bio: 'I help startups and product teams turn complex workflows into simple interfaces, on mobile and web.


  Right now I’m building [Frolickk](/case-studies/005), a personal reading app I designed in Figma and built with Claude Code, testing every iteration on my own phone.


  Before that, I designed the teacher side of [GradeX](https://gradexpro.com/), a school management SaaS used by 20+ schools. I was also the founding designer at [Lofai](https://www.crunchbase.com/organization/lofai), where I designed the full MVP of a marketplace connecting customers with independent tailors.'
bioMobile: 'I help startups and product teams turn complex workflows into simple interfaces, on mobile and web.


  Right now I’m building a personal side project: [Frolickk](/case-studies/005), a reading app I designed in Figma and built with Claude Code, testing every iteration on my own phone.


  Before that, I designed the teacher side of [GradeX](https://gradexpro.com/), a school management SaaS used by 20+ schools. I was also the founding designer at [Lofai](https://www.crunchbase.com/organization/lofai), where I designed the full MVP of a marketplace connecting customers with independent tailors.'
note: 'Probably somewhere obsessing over an easing curve, reading a book, or playing a DF: Hotzone round.'
